<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoardMate — Step 2 Mockups</title>
<style>
:root{
  --primary:#4F6BED; --primary-soft:#E8ECFF; --primary-dark:#3550C8;
  --bg:#F5F7FF; --card:#FFFFFF; --text:#1F2544; --muted:#6B7194; --line:#E6E9F5;
  --paid:#21A366; --paid-soft:#E3F6EC;
  --pending:#E39B12; --pending-soft:#FFF3DA;
  --overdue:#E5484D; --overdue-soft:#FDE6E7;
  --home:#21A366; --away:#8A90AE;
  --radius:20px; --shadow:0 4px 18px rgba(48,62,140,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Segoe UI",Roboto,system-ui,sans-serif;background:#E9ECF8;color:var(--text)}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top h1{font-size:18px;margin:0}
header.top h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls label{font-size:13px;color:var(--muted)}
.controls select{font:inherit;padding:6px 10px;border-radius:10px;border:1px solid var(--line)}
.layout{display:grid;grid-template-columns:230px 410px minmax(260px,1fr);gap:22px;padding:22px;align-items:start;max-width:1280px;margin:0 auto}
@media(max-width:1000px){.layout{grid-template-columns:1fr;justify-items:center}.index,.notes{width:100%;max-width:410px}}
.index{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--shadow);position:sticky;top:80px}
.index h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 8px 6px}
.index a{display:block;padding:8px 10px;border-radius:10px;color:var(--text);text-decoration:none;font-size:14px;cursor:pointer}
.index a:hover{background:var(--bg)}
.index a.on{background:var(--primary-soft);color:var(--primary-dark);font-weight:700}
.notes{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);position:sticky;top:80px}
.notes h2{margin:0 0 4px;font-size:20px}
.notes .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);margin-bottom:10px}
.notes h4{margin:16px 0 6px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.notes p,.notes li{font-size:14.5px;line-height:1.5}
.notes ul{padding-left:18px;margin:4px 0}

/* phone */
.phone{width:390px;height:820px;background:#111;border-radius:46px;padding:12px;box-shadow:0 20px 50px rgba(20,30,80,.25);position:relative}
.screen{width:100%;height:100%;background:var(--bg);border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px;font-weight:700;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:4px 16px 20px;scrollbar-width:thin}
.appbar{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.appbar h2{font-size:22px;margin:0;flex:1}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:#fff;box-shadow:var(--shadow);font-size:20px;cursor:pointer;display:grid;place-items:center}
.nav{display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:6px 4px 14px;flex-shrink:0}
.nav button{border:0;background:transparent;font:inherit;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;min-height:52px;cursor:pointer;border-radius:14px;padding-top:4px;position:relative}
.nav button .ic{font-size:22px}
.nav button.on{color:var(--primary-dark);font-weight:800}
.nav button.on .ic{background:var(--primary-soft);border-radius:999px;padding:0 14px}
.badge{position:absolute;top:0;right:10px;background:var(--overdue);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px}

.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.99)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-size:28px;font-weight:800}
.h{font-weight:800;font-size:16px}
.sec{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 8px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0;position:relative}
.avatar .dot{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.paid{background:var(--paid-soft);color:var(--paid)}
.pending{background:var(--pending-soft);color:#B07400}
.overdue{background:var(--overdue-soft);color:var(--overdue)}
.neutral{background:#EEF0F7;color:var(--muted)}
.homec{background:var(--paid-soft);color:var(--paid)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:16px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:var(--primary);color:#fff;margin-top:8px}
.btn.secondary{background:var(--primary-soft);color:var(--primary-dark)}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--overdue);color:#fff}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px;width:auto;padding:0 14px;margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:0 0 6px 4px}
.field input,.field select,.field textarea{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);padding:12px 14px;font:inherit;font-size:16px;background:#fff;color:var(--text)}
.field textarea{min-height:90px;resize:none}
.field .err{color:var(--overdue);font-size:12.5px;margin:6px 4px 0;display:none}
.field.invalid input{border-color:var(--overdue)}
.field.invalid .err{display:block}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer}
.pill.on{background:var(--primary);border-color:var(--primary);color:#fff}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.toggle{width:52px;height:30px;border-radius:999px;background:#D5D9EA;position:relative;cursor:pointer;flex-shrink:0;border:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--primary)}
.toggle.on::after{left:25px}
.banner{border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--pending-soft);color:#7A5200}
.banner.info{background:var(--primary-soft);color:var(--primary-dark)}
.banner.bad{background:var(--overdue-soft);color:#9B1C20}
.banner.good{background:var(--paid-soft);color:#11683F}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:#fff;border-radius:18px;box-shadow:var(--shadow);border:0;font:inherit;padding:12px 6px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--text);text-align:center}
.tile .em{font-size:30px}
.tile.emer{background:var(--overdue-soft);color:var(--overdue)}
.tile:active{transform:scale(.97)}
.progress{height:10px;background:#EEF0F7;border-radius:999px;overflow:hidden}
.progress > div{height:100%;background:var(--paid);border-radius:999px}
.room{border-left:6px solid var(--primary)}
.bed{background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:8px;cursor:pointer}
.qr{width:220px;height:220px;margin:8px auto;display:grid;grid-template-columns:repeat(25,1fr);background:#fff;padding:10px;border-radius:16px;box-shadow:var(--shadow)}
.qr div{background:#fff}.qr div.b{background:#1F2544}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--primary)}
.pin-dots span.f{background:var(--primary)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 20px}
.keypad button{height:66px;border-radius:20px;border:0;background:#fff;font:inherit;font-size:26px;font-weight:700;box-shadow:var(--shadow);cursor:pointer}
.hero{text-align:center;padding:18px 6px 6px}
.hero .em{font-size:56px}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35);transition:none}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:#1F2544;color:#fff;border-radius:16px;padding:14px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:none}
.notif{position:absolute;left:10px;right:10px;top:40px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:31;font-size:13.5px;transform:translateY(calc(-100% - 60px));visibility:hidden;transition:.3s}
.notif.show{transform:none;visibility:visible}
.sheet-bg{position:absolute;inset:0;background:rgba(20,25,60,.35);z-index:25;display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:10px 18px 24px;z-index:26;transform:translateY(100%);transition:.25s;max-height:85%;overflow-y:auto}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#D5D9EA;margin:0 auto 12px}
.skel{background:linear-gradient(90deg,#E8EBF6 25%,#F3F5FC 50%,#E8EBF6 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:16px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:84px;height:84px;border-radius:14px;display:grid;place-items:center;font-size:30px;position:relative;cursor:pointer;background:linear-gradient(135deg,#DDE4FF,#F3E8FF)}
.thumb .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#1F2544;color:#fff;font-size:13px;display:grid;place-items:center;border:0;cursor:pointer}
.thumb.add{background:#fff;border:2px dashed var(--line);font-size:13px;font-weight:800;color:var(--muted);flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px}
.thumb.add span{font-size:26px}
.field.invalid .thumb.add{border-color:var(--overdue)}
.receipt{background:#fff;border-radius:18px;padding:18px;border:2px dashed var(--line)}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14.5px}
.kv.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:16px}
a.link{color:var(--primary-dark);font-weight:800;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<header class="top">
  <h1>🏠 BoardMate <small>Step 2 · Interactive mockups (390px phone)</small></h1>
  <div class="controls">
    <div class="seg" id="roleSeg">
      <button data-role="manager" class="on">👩‍💼 Manager</button>
      <button data-role="tenant">🧑 Tenant</button>
    </div>
    <label>Screen state
      <select id="stateSel">
        <option value="normal">Normal</option>
        <option value="loading">Loading</option>
        <option value="empty">Empty</option>
        <option value="error">Error</option>
      </select>
    </label>
    <label id="personaWrap" style="display:none">Tenant <select id="personaSel"><option value="2">Joy Dela Cruz</option><option value="3">Paolo Reyes</option><option value="1">Maria Santos</option></select></label>
    <label id="offlineWrap" style="display:none">
      <select id="offlineSel">
        <option value="online">On house WiFi</option>
        <option value="away">Away from house WiFi</option>
        <option value="hostaway">Home, but host is away</option>
      </select>
    </label>
  </div>
</header>

<div class="layout">
  <nav class="index" id="index"></nav>
  <div class="phone">
    <div class="screen" id="screen">
      <div class="statusbar"><span>7:42 PM</span><span>📶 🔋 82%</span></div>
      <div class="content" id="content"></div>
      <div class="nav" id="nav"></div>
      <div class="sheet-bg" id="sheetBg"></div>
      <div class="sheet" id="sheet"></div>
      <div class="toast" id="toast"></div>
      <div class="notif" id="notif"></div>
    </div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
/* ---------------- Sample data (3 rooms, 6 tenants) ---------------- */
const peso = c => "₱" + (c/100).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const colors = ["#4F6BED","#F08A5D","#2BB3A3","#B66DFF","#E85D9C","#E3A008"];
const rooms = [
  {id:"A", name:"Room A", emoji:"🌻", price:500000,cap:2,eff:"Oct 1, 2026"},
  {id:"B", name:"Room B", emoji:"🌊", price:500000,cap:2,eff:"Oct 1, 2026"},
  {id:"C", name:"Room C", emoji:"🌙", price:500000,cap:2,eff:"Oct 1, 2026"},
];
const tenants = [
  {id:1,name:"Maria Santos",first:"Maria",room:"A",bed:"Lower bed",share:250000,due:5, status:"paid",   nextDue:"Nov 5", pres:"home",   seen:"6:15 PM", phone:"0917 123 4567", paired:true, consent:true},
  {id:2,name:"Joy Dela Cruz",first:"Joy",room:"A",bed:"Upper bed",share:250000,due:12,status:"pending",nextDue:"Oct 12",pres:"away",   seen:"8:02 AM", phone:"0918 555 0101", paired:true, consent:true, note:"GCash ref 1009 2345 6789 — waiting for your check"},
  {id:3,name:"Paolo Reyes",first:"Paolo",room:"B",bed:"Lower bed",share:250000,due:15,status:"overdue",nextDue:"Oct 15",pres:"home",   seen:"7:30 PM", phone:"0927 888 2222", paired:true, consent:true},
  {id:4,name:"Mark Villanueva",first:"Mark",room:"B",bed:"Upper bed",share:250000,due:1, status:"paid",   nextDue:"Nov 1", pres:"home",   seen:"7:41 PM", phone:"0905 333 9090", paired:true, consent:true},
  {id:5,name:"Angel Bautista",first:"Angel",room:"C",bed:"Lower bed",share:250000,due:28,status:"pending",nextDue:"Oct 28",pres:"away",   seen:"12:10 PM",phone:"0919 444 7878", paired:true, consent:true, note:"Due in 8 days"},
  {id:6,name:"Kim Navarro",first:"Kim",room:"C",bed:"Upper bed",share:250000,due:8, status:"paid",   nextDue:"Nov 8", pres:"manual", seen:"5:50 PM", phone:"0995 222 1313", paired:false,consent:false},
];
const statusLabel = {paid:"✓ Paid", pending:"⏳ Pending", overdue:"! Overdue"};
const presLabel = t => t.pres==="home" ? "🏠 Home" : t.pres==="manual" ? "✋ Home (check-in)" : "🚶 Away";
const initials = n => n.split(" ").map(x=>x[0]).slice(0,2).join("");
const avatar = (t,dot=true) => `<div class="avatar" style="background:${colors[(t.id-1)%6]}">${initials(t.name)}${dot?`<span class="dot" style="background:${t.pres==="away"?"var(--away)":"var(--home)"}"></span>`:""}</div>`;
tenants.forEach(t=>t.dep=30);tenants[2].dep=25; // Paolo: 5 days overdue -> 25 of 30 deposit days left
let me = tenants[1]; // tenant persona (Joy / Paolo / Maria)
let _u=100;const uid=()=>++_u;const mgr=()=>S.mgr;const tn=id=>tenants.find(t=>t.id===id);
const MI={Cash:"💵",GCash:"📱",Maya:"💚",Bank:"🏦"};
const esc=x=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const shares=(tot,n)=>Array.from({length:n},(_,i)=>Math.floor(tot/n)+(i<tot%n?1:0));
const money=v=>Math.round(parseFloat(String(v).replace(/,/g,""))*100)||0;
const fd=x=>new Date(x+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const payQ=[{id:1,tid:2,amt:250000,method:"GCash",ref:"1009 2345 6789",sent:"Oct 12, 9:14 AM"}];
const receipts=[{tid:1,amt:250000,method:"GCash",date:"Oct 5"},{tid:4,amt:250000,method:"Cash",date:"Oct 1"},{tid:6,amt:250000,method:"Bank",date:"Oct 8"}];
const alerts={in:[
 {id:1,em:"🔊",title:"Too noisy",room:"Room B",from:"Joy",time:"10 min ago · inside quiet hours",st:"pending",msg:"Loud music past quiet hours."},
 {id:2,em:"🧹",title:"Needs cleaning",room:"Kitchen",from:"Mark",time:"Yesterday 4:10 PM",st:"done",msg:"Dishes piled up in the sink.",act:"Reminded everyone."},
 {id:3,em:"⚡",title:"Brownout on my side",room:"Room C",from:"Angel",time:"Oct 18, 2:05 PM",st:"done",msg:"",act:"Checked the breaker."}],
 out:[{em:"📦",title:"Parcel for you",to:"Joy",msg:"Hi Joy! You have a parcel 📦 waiting at the front.",time:"Oct 20, 4:30 PM",sms:1},{em:"🗑️",title:"Garbage day",to:"Everyone",msg:"Garbage collection tomorrow morning. Please bring your trash down tonight 🗑️",time:"Oct 18, 7:00 PM",sms:0}]};
const maint=[
 {id:1,st:"open",cat:"🚰",title:"Leaking faucet in CR",room:"Room A",by:"Joy",time:"Today 3:20 PM",desc:"Water keeps dripping even when closed tight.",ph:["🚰","💧"],urg:"High"},
 {id:2,st:"open",cat:"🌀",title:"Electric fan not turning",room:"Room C",by:"Angel",time:"Yesterday",desc:"",ph:[],urg:"Medium"},
 {id:3,st:"prog",cat:"💡",title:"Hallway light flickering",room:"Common area",by:"Mark",time:"Oct 17",desc:"",ph:[],urg:"Low",note:"Bought new bulb, will install Saturday."},
 {id:4,st:"done",cat:"💡",title:"Room light flickering",room:"Room A",by:"Joy",time:"Sep 30",desc:"",ph:[],urg:"Low",note:"Replaced the bulb"}];
const EMO=[["🔊","Quiet hours","Please keep noise down, quiet hours are in effect."],["💡","Lights / fan on","Lights or fan were left on. Please turn them off."],["🚪","Gate unlatched","The gate was left unlocked. Please check the latch."],["💧","Water running","A tap is left running in the CR. Please close it tightly."],["🍳","Stove unattended","Please do not leave the stove unattended."],["📦","Parcel arrived","A parcel arrived and is on the front table."],["🗑️","Trash day","Garbage collection is tomorrow morning. Please bring bags out."],["⚡","Brownout notice","Scheduled power interruption in our barangay."],["🚿","Water notice","Low water pressure expected. Please store water."],["🧹","Cleaning day","General cleaning of hallway and shared CR today."],["👥","Visitor notice","Overnight visitors must register with the manager."],["🌙","Curfew 11 PM","House curfew is 11:00 PM. The gate will be padlocked."],["🔧","Repair today","A technician is coming between 1 PM and 3 PM."],["💵","Rent reminder","Gentle reminder: rent is due soon. Salamat!"],["📢","Announcement","Please check the bulletin board for a house advisory."],["🚨","Urgent notice","Urgent notice about house safety."]];
const EC={1:["Elena Santos (Sister)","0920 111 2233"],2:["Lourdes Dela Cruz (Mother)","0919 876 5432"],3:["Roberto Reyes (Father)","0917 555 4321"],4:["Danilo Villanueva (Uncle)","0922 333 4455"],5:["Grace Bautista (Mother)","0918 999 8877"],6:["Manuel Navarro (Father)","0921 222 3344"]};
tenants.forEach(t=>{t.ec=EC[t.id][0];t.ecp=EC[t.id][1];});
const payAcc={GCash:{on:true,name:"Nena Santos",num:"0917 123 4567",qr:"sample"},Maya:{on:true,name:"Nena Santos",num:"0918 765 4321",qr:"sample"},Bank:{on:false,name:"Nena Santos",bank:"BPI",num:"1234 5678 90",qr:null},Cash:{on:true,note:"Hand the cash to the manager. They'll confirm it here."}};
const qrView=m=>{const a=payAcc[m];return a.qr==="sample"?`<div style="zoom:.75">${qrGrid(m.length*53)}</div>`:`<img src="${a.qr}" alt="${m} QR" style="width:190px;max-width:100%;border-radius:14px;border:1px solid var(--line)">`;};
const payMethods=()=>{const l=["Cash","GCash","Maya","Bank"].filter(m=>payAcc[m].on);if(!l.includes(S.method))S.method=l.includes("GCash")?"GCash":"Cash";return l;};
function payTo(){const m=S.method,a=payAcc[m];if(m==="Cash")return `<div class="banner info">💵 <div>${esc(a.note)}</div></div>`;return `<div class="card" style="border:2px solid var(--primary-soft)"><div class="muted small">Send ${peso(me.share)} to</div><div class="h" style="font-size:17px">${MI[m]} ${esc(a.name)}${m==="Bank"?" · "+esc(a.bank):""}</div><div class="row between" style="margin:6px 0"><b style="font-size:19px">${esc(a.num)}</b><button class="btn sm secondary" onclick="copyNum('${m}')">📋 Copy</button></div>${a.qr?`<div style="text-align:center;margin-top:6px">${qrView(m)}<div class="muted small">Scan with your ${m} app, then attach your receipt below</div></div>`:`<div class="muted small">Use the number above, then attach your receipt below.</div>`}</div>`;}
function copyNum(m){try{navigator.clipboard.writeText(payAcc[m].num)}catch(e){}toast("📋 Number copied");}

// Banners: keep the leading emoji in its own column and the text in one block.
function fixBanners(root){root.querySelectorAll('.banner:not([data-f])').forEach(b=>{b.dataset.f=1;const kids=[...b.childNodes].filter(n=>!(n.nodeType===3&&!n.textContent.trim()));if(kids.length===2&&kids[1].nodeName==='DIV')return;const t=b.firstChild;if(!t||t.nodeType!==3)return;const str=t.textContent.trimStart();const i=str.indexOf(' ');const em=str.slice(0,i);t.textContent=str.slice(i+1);const d=document.createElement('div');while(b.firstChild)d.appendChild(b.firstChild);const e=document.createElement('span');e.textContent=em;b.append(e,d);});}
function toast(msg){const t=document.getElementById("toast");t.innerHTML=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}
function notif(title,body){const n=document.getElementById("notif");n.innerHTML=`<div class="row"><b style="font-size:18px">🏠</b><div class="grow"><b>${title}</b><div class="muted">${body}</div></div><span class="muted small">now</span></div>`;n.classList.add("show");clearTimeout(n._h);n._h=setTimeout(()=>n.classList.remove("show"),3200);}
function openSheet(html){document.getElementById("sheet").innerHTML=`<div class="grab"></div>`+html;document.getElementById("sheet").classList.add("show");fixBanners(document.getElementById("sheet"));document.getElementById("sheetBg").style.display="block";}
function closeSheet(){document.getElementById("sheet").classList.remove("show");document.getElementById("sheetBg").style.display="none";}

function appbar(title,back,right=""){return `<div class="appbar">${back?`<button class="iconbtn" onclick="go('${back}')">←</button>`:""}<h2>${title}</h2>${right}</div>`;}
function qrGrid(seed){let h="";let x=seed;for(let i=0;i<625;i++){x=(x*9301+49297)%233280;const r=Math.floor(i/25),c=i%25;const finder=(r<7&&c<7)||(r<7&&c>17)||(r>17&&c<7);let b;if(finder){const rr=r>17?r-18:r,cc=c>17?c-18:c;b=(rr===0||rr===6||cc===0||cc===6)||(rr>=2&&rr<=4&&cc>=2&&cc<=4);}else b=x/233280>.5;h+=`<div class="${b?"b":""}"></div>`;}return `<div class="qr">${h}</div>`;}

"m-billing":{role:"manager",title:"Billing & payments",tab:"bill",empty:"No bills this month. Bills are created automatically on each tenant's due date.",
 purpose:"Collect rent. The settlement card gives a single-glance snapshot, payments tenants reported wait in the verify queue, and the 6-month graph shows income against vacancy.",
 flow:["Settlement card: “X of 6 Paid · Y Overdue”, the money collected so far, and a 1-tap reminder for overdue tenants.","“To verify” lists payments tenants reported, with reference number and receipt photo (tap to zoom). Verify → tenant becomes Paid and gets a receipt. Request clearer proof keeps it pending.","Verify all clears the whole queue in one tap once you've checked GCash.","Tap a month in the graph to see collected rent and any vacancy dip.","＋ Log payment → payment form (cash, GCash, Maya, bank)."],
 render:()=>{const c=counts(),pm=S.pm??5,mo=income(),m=mo[pm];return appbar("Billing",null,`<button class="iconbtn" onclick="go('m-pay')">＋</button>`)+`
 <div class="card"><div class="row between"><div><div class="muted small">Monthly settlement · October 2026</div><div class="h" style="font-size:20px">${c.paid} of ${tenants.length} Paid · ${c.over} Overdue</div><div class="big" style="margin-top:4px">${peso(c.col)}</div><div class="muted small">collected of ${peso(c.exp)}</div></div><div class="pills"><span class="chip neutral">⚡💧📶 Included</span></div></div><div class="progress" style="margin-top:10px"><div style="width:${c.pct}%"></div></div>${c.over?`<button class="btn secondary" onclick="remindOverdue()">💸 Remind ${c.over} overdue tenant${c.over>1?"s":""}</button>`:""}</div>
 <div class="sec">To verify (${payQ.length})</div>
 ${payQ.length?payQ.map(q=>{const t=tn(q.tid);return `<div class="card" style="border:2px solid var(--pending)"><div class="row">${avatar(t,false)}<div class="grow"><div class="h">${t.first} · ${peso(q.amt)}</div><div class="muted small">${MI[q.method]} ${q.method} · Ref <b>${q.ref}</b><br>Sent ${q.sent}</div></div><div class="thumb" style="width:64px;height:64px;font-size:24px" onclick="viewPhoto('🧾')">🧾</div></div>${q.note?`<div class="banner warn" style="margin:8px 0 0">📨 <div>${q.note}</div></div>`:`<div class="muted small" style="margin-top:6px">Tap the receipt to zoom. Compare amount + reference with your GCash app.</div>`}<div class="btns"><button class="btn sm" style="background:var(--paid)" onclick="verifyPay(${q.id})">✓ Verify</button><button class="btn sm ghost" onclick="rejectPay(${q.id})">✕ Request clearer proof</button></div></div>`}).join("")+(payQ.length>1?`<button class="btn secondary" onclick="verifyAll()">✓ Verify all (${payQ.length})</button>`:""):`<div class="card"><div class="row"><div style="font-size:28px">✅</div><div class="grow"><div class="h">All caught up</div><div class="muted small">No payments waiting for your check</div></div></div></div>`}
 <div class="sec">6-month income & vacancy</div>
 <div class="card"><div style="display:flex;align-items:flex-end;gap:8px;height:130px;border-bottom:1px solid var(--line);padding-bottom:6px">${mo.map((x,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer" onclick="S.pm=${i};render()"><span class="muted" style="font-size:10px;font-weight:800">₱${(x.col/100000).toFixed(1)}k</span><div style="width:100%;max-width:30px;display:flex;flex-direction:column;border-radius:8px 8px 0 0;overflow:hidden;${i===pm?"outline:2px solid var(--primary);":""}">${x.vac?`<div style="height:${Math.max(12,Math.round(x.vac/16667))}px;background:var(--overdue)"></div>`:""}<div style="height:${Math.max(6,Math.round(x.col/16667))}px;background:var(--primary)"></div></div><span class="muted" style="font-size:10px">${x.m}</span></div>`).join("")}</div>
 <div class="row" style="gap:12px;margin-top:8px"><span class="small muted">🟦 Collected</span><span class="small muted">🟥 Vacancy dip</span></div>
 <div class="kv" style="margin-top:6px"><span class="muted">${m.m} 2026</span><b>${peso(m.col)} of ${peso(m.pot)}</b></div>${m.vac?`<div class="banner warn" style="margin:6px 0 0">🛏️ <div>One bed was empty → <b>${peso(m.vac)}</b> lost to vacancy.</div></div>`:""}</div>
 <div class="sec">Current cycles</div>
 <div class="card list">${tenants.map(t=>`<div class="item" style="cursor:pointer" onclick="go('m-tenant',${t.id})">${avatar(t,false)}<div class="grow"><div class="h">${t.first} <span class="muted small">· Room ${t.room}</span></div><div class="muted small">${t.status==="paid"?"Next due "+t.nextDue:"Due "+t.nextDue} · ${peso(t.share)}</div></div><span class="chip ${t.status}">${statusLabel[t.status]}</span></div>`).join("")}</div>
 <div class="sec">Verified receipts (${receipts.length})</div>
 <div class="card list">${receipts.slice(0,5).map(r=>`<div class="item" style="cursor:pointer" onclick="showReceipt(${r.tid})"><span style="font-size:22px">${MI[r.method]}</span><div class="grow"><div class="h">${tn(r.tid).first} · ${peso(r.amt)}</div><div class="muted small">${r.method} · ${r.date}</div></div><span class="chip paid">🧾</span></div>`).join("")}</div>
 <button class="btn secondary" onclick="toast('📤 Monthly summary image ready to share')">📤 Share October summary</button>`}},

"m-pay":{role:"manager",title:"Log payment",tab:"bill",nav:false,

 ${S.method!=="Cash"?`<div class="field" id="refField"><label>Reference number *</label><input id="ref" placeholder="e.g. 1009 2345 6789"><div class="err">Reference number is required for ${S.method}.</div></div>`:""}

"m-alerts":{role:"manager",title:"Quick Alerts",tab:"alerts",empty:"All quiet 🌙 No alerts from tenants.",
 purpose:"Inbox for the emoji buttons tenants press, plus the manager's own 16 situation buttons to send a notice to the whole house or to one room.",
 flow:["Incoming: tenant reports arrive instantly with a notification. Only the manager sees who sent one. Reply to room, mark Done, Dismiss, or Reopen later.","Send notice: pick Everyone or a room, tap one of the 16 emoji situations (title and message fill in and stay editable), then send. “SMS fallback” texts tenants whose app is closed.","History keeps every notice you sent, and tenants can read them under Announcements › House notices."],
 render:()=>{const tab=S.at||"in",f=S.af||"all",pc=pendCnt(),d=S.d;let body="";
 const head=appbar("Quick Alerts")+`<div class="pills" style="margin-bottom:12px">${[["in","Incoming"+(pc?" ("+pc+")":"")],["send","Send notice"],["hist","History ("+alerts.out.length+")"]].map(x=>`<button class="pill ${tab===x[0]?"on":""}" onclick="S.at='${x[0]}';render()">${x[1]}</button>`).join("")}</div>`;
 if(tab==="in"){const l=alerts.in.filter(a=>f==="all"||a.st===f);body=`<div class="pills" style="margin-bottom:12px">${["all","pending","done","dismissed"].map(k=>`<button class="pill ${f===k?"on":""}" onclick="S.af='${k}';render()">${k[0].toUpperCase()+k.slice(1)} (${alerts.in.filter(a=>k==="all"||a.st===k).length})</button>`).join("")}</div>`+(l.length?l.map(a=>`<div class="card" ${a.st==="pending"?'style="border:2px solid var(--overdue-soft)"':""}><div class="row"><div style="font-size:30px">${a.em}</div><div class="grow"><div class="h">${a.title} · ${a.room}</div><div class="muted small">${a.time}</div><div class="small" style="margin-top:4px">${a.tid?"📲 Joined by scanning your QR":`🔒 From <b>${a.from}</b> (only you can see this)`}</div></div><span class="chip ${a.st==="pending"?"overdue":a.st==="done"?"paid":"neutral"}">${a.st==="pending"?"New":a.st==="done"?"Handled":"Dismissed"}</span></div>${a.msg?`<p class="small" style="margin:8px 0 0">${a.msg}</p>`:""}${a.act?`<div class="banner good" style="margin:8px 0 0">✅ <div>${a.act}</div></div>`:""}<div class="btns">${a.st==="pending"?`${a.tid?`<button class="btn sm" onclick="go('m-tenant',${a.tid})">👤 View profile</button>`:`<button class="btn sm" onclick="alertReply(${a.id})">🤫 Reply to room</button>`}<button class="btn sm secondary" onclick="alertSet(${a.id},'done')">✓ Done</button><button class="btn sm ghost" onclick="alertSet(${a.id},'dismissed')">Dismiss</button>`:`<button class="btn sm ghost" onclick="alertSet(${a.id},'pending')">↺ Reopen</button>`}</div></div>`).join(""):`<div class="hero"><div class="em">🌙</div><div class="h" style="margin-top:8px">No ${f} reports</div><p class="muted">All quiet.</p></div>`);}
 else if(tab==="send"){body=`<div class="card"><div class="field"><label>Send to</label><div class="pills"><button class="pill ${d.t==="all"?"on":""}" onclick="S.d.t='all';render()">🏠 Everyone</button>${rooms.map(r=>`<button class="pill ${d.t==="room"&&d.room===r.name?"on":""}" onclick="S.d.t='room';S.d.room='${r.name}';render()">${r.emoji} ${r.name}</button>`).join("")}</div></div>
 <div class="field"><label>Pick a situation (16 presets)</label><div class="tiles" style="grid-template-columns:repeat(4,1fr);gap:8px">${EMO.map((e,i)=>`<button class="tile" style="min-height:76px;font-size:10px;padding:8px 2px;${d.i===i?"outline:3px solid var(--primary);background:var(--primary-soft)":""}" onclick="pickEmo(${i})"><span class="em" style="font-size:24px">${e[0]}</span>${e[1]}</button>`).join("")}</div></div>
 <div class="field"><label>Title</label><input value="${esc(d.title)}" oninput="S.d.title=this.value"></div>
 <div class="field"><label>Message (editable)</label><textarea oninput="S.d.msg=this.value">${esc(d.msg)}</textarea></div>
 <div class="banner info">📶 <div><b>Local WiFi broadcast</b> · delivered instantly to open apps.</div></div>
 <div class="row between" style="min-height:48px"><span>💬 SMS fallback if away<br><span class="muted small">Texts each tenant's saved mobile number · ${tenants.filter(t=>t.phone).length} of ${tenants.length} have one</span></span><button class="toggle ${d.sms?"on":""}" onclick="S.d.sms=!S.d.sms;this.classList.toggle('on')"></button></div>
 <button class="btn" onclick="dispatch()">📤 Send notice now</button></div>`;}
 else{body=alerts.out.length?alerts.out.map(a=>`<div class="card"><div class="row"><div style="font-size:28px">${a.em}</div><div class="grow"><div class="h">${a.title}</div><div class="muted small">To ${a.to} · ${a.time}${a.sms?" · + SMS":""}</div></div><span class="chip paid">Sent</span></div><p class="small" style="margin:8px 0 0">${a.msg}</p></div>`).join(""):`<div class="hero"><div class="em">📭</div><div class="h" style="margin-top:8px">No notices sent yet</div></div>`;}
 return head+body;}},

"m-payset":{role:"manager",title:"Payment methods",tab:"more",

 flow:["Turn a method on or off (Cash is always available).","Type the account name and number. For Bank, add the bank name.","Tap Upload QR and choose the photo or screenshot of your GCash, Maya or bank QR. Tenants see it instantly and can copy the number.","A method that is turned off is hidden from tenants."],

"m-pair":{role:"manager",title:"Pair a tenant (QR)",tab:"more",nav:false,
 purpose:"Connect a tenant's phone to the house once. The QR holds the host address, port, house ID and a one-time code that expires in 10 minutes. For a vacant bed, the new tenant types their own details after scanning, and only then do they appear in your lists.",

 render:()=>{const copy=c=>`<div class="card row between"><div class="grow"><div class="h">Manual connection code</div><div class="muted small">192.168.1.50:8080#${c}</div></div><button class="btn sm ghost" onclick="copyCode()">📋 Copy</button></div>`;
 if(S.param==="bed"){const pr=S.pairing;if(!pr){const t=tenants[tenants.length-1];return appbar("Add a tenant","m-rooms")+`<div class="hero"><div class="em">🎉</div><h2 style="margin:6px 0">${t.first} joined!</h2><div class="muted">${t.name} filled in their details and now appears in Rooms.</div></div><button class="btn" onclick="go('m-tenant',${t.id})">👤 View ${t.first}'s profile</button><button class="btn ghost" onclick="go('m-rooms')">Back to Rooms</button>`;}
 const r=rooms.find(x=>x.id===pr.room),sh=shares(r.price,r.cap)[pr.idx]||0;return appbar("Add a tenant","m-rooms")+`
 <div class="card" style="text-align:center"><div class="chip pending" style="margin-bottom:6px">${r.emoji} ${r.name} · Bed ${pr.idx+1} · ${peso(sh)} / month</div>${qrGrid(pr.idx*31+r.name.length*17)}<div class="h">Scan with the new tenant's phone</div><div class="muted small">192.168.1.50 · port 8080 · one-time code</div><div class="chip pending" style="margin-top:8px">⏱ Expires in 9:41</div><div class="btns" style="justify-content:center"><button class="btn sm ghost" onclick="pairBed('${r.id}',${pr.idx})">🔄 New code</button></div></div>
 <div class="banner warn">⏳ <div><b>Waiting for the tenant to scan…</b><br>Mockup: switch to <b>Tenant</b> at the top, then tap “Simulate QR scan” and fill in the form.</div></div>
 <div class="banner info">📲 <div>After scanning, the tenant types their own <b>name, mobile number and emergency contact</b>. They appear here only after they submit, so nothing is half-filled.</div></div>`+copy(pr.code);}

"t-consent":{role:"tenant",title:"Presence consent",nav:false,
 purpose:"Shown once after pairing (and any time from Me › Privacy). Explains exactly what the manager can see, as required by the Data Privacy Act (RA 10173). Presence is optional.",
 flow:["Allow → Permission explainer screen.","Not now → presence stays off; the tenant can use the manual \"I'm home\" button.","The tenant can change this anytime in Me › Presence sharing. Stopping deletes nothing else."],
 render:()=>`<div class="hero"><div class="em">🏠💚</div><h2 style="margin:6px 0">Share when you're home?</h2><div class="muted">This helps ${mgr()} know who's inside, for example at gate-lock time or in an emergency.</div></div>
 <div class="card"><div class="h" style="color:var(--paid)">✓ The manager CAN see</div><ul class="small" style="line-height:1.7"><li><b>Home</b> or <b>Away</b> — based only on whether you're connected to the house WiFi</li><li>The <b>time</b> you were last seen at home</li></ul>
 <div class="h" style="color:var(--overdue);margin-top:6px">✕ The manager can NEVER see</div><ul class="small" style="line-height:1.7"><li>Your GPS location or where you go</li><li>Your messages, apps, photos or browsing</li><li>Anything while you're away from the house</li></ul>
 <div class="small muted">History is kept 30 days and deleted when you move out. You can turn this off anytime.</div></div>
 <button class="btn" onclick="go('t-perm')">Allow presence sharing</button><button class="btn ghost" onclick="toast('OK! Use the ✋ I\\'m home button when you arrive.');setTimeout(()=>go('t-home'),600)">Not now — I'll check in manually</button>`},

"t-perm":{role:"tenant",title:"Permission explainer",nav:false,
 purpose:"Android only lets apps read the WiFi name if Location permission is given and Location is turned on. This screen explains why, before Android's own pop-ups appear, and checks each item.",
 flow:["Each row has a Fix button that opens the right Android setting.","\"Allow all the time\" is needed so presence works when the app is closed.","Battery: shows phone-brand steps (Xiaomi, Oppo, Vivo, Realme, Samsung) so Android doesn't stop the app.","Done → Home. Missing items show a gentle warning on Me › Connection."],
 render:()=>`<div class="hero"><div class="em">📍❓</div><h2 style="margin:6px 0">Why does it ask for Location?</h2><div class="muted">Android treats the WiFi name as location info. BoardMate only checks <b>which WiFi</b> you're on — never your GPS position.</div></div>
 <div class="card list">
 <div class="item"><span style="font-size:24px">📍</span><div class="grow"><div class="h">Location permission</div><div class="muted small">Choose "Allow all the time"</div></div><span class="chip paid">✓ Done</span></div>
 <div class="item"><span style="font-size:24px">🛰️</span><div class="grow"><div class="h">Location is turned on</div><div class="muted small">Quick settings → Location</div></div><span class="chip paid">✓ On</span></div>
 <div class="item"><span style="font-size:24px">🔋</span><div class="grow"><div class="h">Battery: don't restrict</div><div class="muted small">Keeps presence working when closed</div></div><button class="btn sm" onclick="toast('Opening battery settings… (Xiaomi steps shown)')">Fix</button></div>
 <div class="item"><span style="font-size:24px">🔔</span><div class="grow"><div class="h">Notifications</div><div class="muted small">For alerts and bill reminders</div></div><span class="chip paid">✓ On</span></div>
 </div>
 <div class="banner info">ℹ️ <div>You'll see a small silent notification <b>"🏠 BoardMate · Home"</b>. Android requires it for apps that run in the background. It sleeps when you're away from the house WiFi.</div></div>
 <button class="btn" onclick="go('t-home')">Done</button>`},

 render:()=>{const p=S.pairing||{room:rooms[rooms.length-1].id,idx:0},r=rooms.find(x=>x.id===p.room),sh=shares(r.price,r.cap)[p.idx]||shares(r.price,r.cap)[0];return `<div class="hero"><div class="em">🏠👋</div><h2 style="margin:6px 0">Welcome to the house!</h2><div class="muted">You're joining <b>${r.emoji} ${r.name} · Bed ${p.idx+1}</b> · ${peso(sh)} / month</div></div>
 <div class="card"><div class="field" id="jf-name"><label>Full name *</label><input id="jn" placeholder="e.g. Ana Dela Cruz"><div class="err">Please type your full name.</div></div>
 <div class="field" id="jf-phone"><label>Mobile number *</label><input id="jp" inputmode="tel" placeholder="09XX XXX XXXX"><div class="err">Please type your mobile number.</div><div class="muted small" style="margin:6px 4px 0">📞 ${mgr()} uses this to call or text you, including SMS alerts when you're away from the house WiFi.</div></div>
 <div class="field"><label>Emergency contact name</label><input id="jen" placeholder="e.g. Mother — Lourdes"></div>
 <div class="field"><label>Emergency contact number</label><input id="jep" inputmode="tel" placeholder="09XX XXX XXXX"></div>
 <div class="field"><label>Move-in date</label><input id="jd" type="date" value="2026-10-22"></div>
 <button class="btn" onclick="joinHouse()">✓ Join the house</button></div>
 <div class="banner info">🔒 <div>The manager sees only what you type here, plus Home/Away from the house WiFi. <a class="link" onclick="go('t-consent')">Read the presence notice →</a></div></div>`}},

"t-emergency":{role:"tenant",title:"Emergency",tab:"home",nav:false,
 purpose:"For real emergencies. Calling 911 is always first and biggest, because the app only works on the house WiFi. The manager alert is a bonus, needs a 2-second hold (no accidental taps), and ignores quiet hours and mute.",

 <div class="btns"><button class="btn sm ghost" style="flex:1" onclick="toast('📞 Calling BFP…')">🚒 BFP (fire)</button><button class="btn sm ghost" style="flex:1" onclick="toast('📞 Calling Barangay…')">🏛️ Barangay</button></div>
 <div class="card" style="margin-top:16px;text-align:center"><div class="h">Alert the manager</div><div class="muted small" style="margin-bottom:8px">Press and hold for 2 seconds</div>

 <div class="banner info">ℹ️ This works only on the house WiFi while the manager's phone is on. Always call 911 first.</div>`},

/* ---------------- Navigation bars ---------------- */
const navs = {
 manager:[["home","🏠","Home","m-dash"],["rooms","🛏️","Rooms","m-rooms"],["bill","💰","Billing","m-billing"],["alerts","🔔","Alerts","m-alerts",1],["more","☰","More","m-more"]],

/* ---------------- Shared bits ---------------- */
function ord(n){return n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th";}
function rulesCard(){return `<div class="card small" style="line-height:1.7">🌙 <b>Quiet hours:</b> 10:00 PM – 6:00 AM<br>🚪 <b>Gate locks:</b> 11:00 PM (tell the manager if you'll be late)<br>👥 <b>Visitors:</b> until 9:00 PM, sala only<br>🧹 <b>Cleaning:</b> clean up after cooking; CR every Saturday by rotation<br>🔌 <b>Appliances:</b> no rice cookers or heaters inside rooms<br>🚭 <b>No smoking</b> inside the house<br>💸 <b>Rent:</b> due on your move-in day each month, 3-day grace period</div>`;}
function netBanner(){if(S.role!=="tenant"||S.net==="online")return "";return S.net==="away"?`<div class="banner info">🚶 <div><b>Away from house WiFi</b> — showing saved info from 7:42 PM. Anything you send will go out when you're back home.</div></div>`:`<div class="banner warn">🟠 <div><b>Manager's phone is away</b> — your messages are saved and will be delivered when it's back.</div></div>`;}
function stateView(sc){
 if(S.state==="loading")return `<div class="appbar"><h2>${sc.title}</h2></div>`+[120,80,80,160].map(h=>`<div class="skel" style="height:${h}px;margin-bottom:12px"></div>`).join("");
 if(S.state==="empty")return `<div class="appbar"><h2>${sc.title}</h2></div><div class="hero" style="padding-top:80px"><div class="em">🌱</div><div class="h" style="margin-top:8px">Nothing here yet</div><p class="muted">${sc.empty||"Nothing to show yet."}</p></div>`;
 if(S.state==="error")return `<div class="appbar"><h2>${sc.title}</h2></div><div class="hero" style="padding-top:80px"><div class="em">😕</div><div class="h" style="margin-top:8px">Couldn't load this</div><p class="muted">${S.role==="tenant"?"Can't reach the house host. Check that you're on the house WiFi.":"The database couldn't be read. Try again, or restore a backup."}</p><button class="btn" onclick="document.getElementById('stateSel').value='normal';S.state='normal';render()">Try again</button></div>`;
}

/* ---------------- Photo picker (mockup) ---------------- */
function photoField(key,label,max,required,icon,errText){const n=S.photos[key]||0;return `<div class="field" id="pf-${key}"><label>${label}${required?" *":" (optional)"}</label><div class="thumbs">${Array.from({length:n},(_,i)=>`<div class="thumb" onclick="viewPhoto('${icon}')">${icon}<button class="x" onclick="event.stopPropagation();S.photos['${key}']--;render()">✕</button></div>`).join("")}${n<max?`<div class="thumb add" onclick="addPhoto('${key}')"><span>📷</span>Add photo</div>`:""}</div><div class="muted small" style="margin:6px 4px 0">Camera or gallery · up to ${max} · auto-shrunk to ~200 KB</div><div class="err">${errText||"Please add a photo."}</div></div>`;}
function addPhoto(key){openSheet(`<div class="h" style="font-size:18px">Add photo</div><button class="btn secondary" onclick="S.photos['${key}']=(S.photos['${key}']||0)+1;closeSheet();render()">📷 Take a photo</button><button class="btn ghost" onclick="S.photos['${key}']=(S.photos['${key}']||0)+1;closeSheet();render()">🖼️ Choose from gallery</button>`);}
function viewPhoto(icon){openSheet(`<div style="height:300px;border-radius:18px;display:grid;place-items:center;font-size:90px;background:linear-gradient(135deg,#DDE4FF,#F3E8FF)">${icon}</div><p class="muted small" style="text-align:center">Full-size photo preview (pinch to zoom in the real app)</p><button class="btn ghost" onclick="closeSheet()">Close</button>`);}

/* ---------------- Actions ---------------- */
function pinKey(n){S.pin+=n;render();if(S.pin.length>=4){setTimeout(()=>{S.pin="";go("m-dash");},250);}}
function editPrice(id){const r=rooms.find(x=>x.id===id);S.er=id;openSheet(`<div class="h" style="font-size:18px">${r.emoji} Edit ${r.name} price</div><div class="field" style="margin-top:12px"><label>Monthly room price (₱)</label><input id="epRent" inputmode="decimal" value="${(r.price/100).toFixed(2)}" oninput="epCalc()"></div><div class="field"><label>Starts from (calendar date)</label><input id="epDate" type="date" value="2026-11-01"></div><div class="banner info">💰 <div id="epPer"></div></div><button class="btn" onclick="saveEdit()">Save</button>`);epCalc();}
function epCalc(){const r=rooms.find(x=>x.id===S.er),p=money(document.getElementById("epRent").value);document.getElementById("epPer").innerHTML=`Split across ${r.cap} beds: <b>${peso(shares(p,r.cap)[0])} / bed</b>. Old bills don't change.`;}
function saveEdit(){const r=rooms.find(x=>x.id===S.er),p=money(document.getElementById("epRent").value);if(p<100000){toast("Please enter a valid price");return;}const d=document.getElementById("epDate").value;r.price=p;if(d)r.eff=fd(d);const sh=shares(p,r.cap);tenants.filter(t=>t.room===r.id).forEach((t,i)=>t.share=sh[i]);closeSheet();render();toast("✓ Price saved. Tenant shares synced from the chosen date.");}
function addRoom(){S.nb=2;openSheet(`<div class="h" style="font-size:18px">＋ Add a room</div><div class="field" style="margin-top:12px"><label>Room name</label><input id="nrName" placeholder="e.g. Room D (extension)"></div><div class="field"><label>Floor</label><select id="nrFloor"><option>1st floor</option><option>2nd floor</option><option>3rd floor</option></select></div><div class="field"><label>Number of beds</label><div class="pills">${[1,2,3,4].map(n=>`<button class="pill ${n===2?"on":""}" onclick="pickBeds(this,${n})">${n} bed${n>1?"s":""}</button>`).join("")}</div></div><div class="field"><label>Total monthly room rent (₱)</label><input id="nrRent" inputmode="decimal" value="6,000.00" oninput="nrCalc()"></div><div class="banner info">💰 <div id="nrPer"></div></div><button class="btn" onclick="saveRoom()">Create room</button>`);nrCalc();}
function pickBeds(el,n){el.parentNode.querySelectorAll(".pill").forEach(x=>x.classList.remove("on"));el.classList.add("on");S.nb=n;nrCalc();}
function nrCalc(){document.getElementById("nrPer").innerHTML=`Divides to <b>${peso(shares(money(document.getElementById("nrRent").value),S.nb)[0])} / bed</b> automatically (rent ÷ ${S.nb} bed${S.nb>1?"s":""}).`;}
function saveRoom(){const n=document.getElementById("nrName").value.trim(),p=money(document.getElementById("nrRent").value);if(!n){toast("Please give the room a name");return;}rooms.push({id:"R"+uid(),name:n,emoji:["🌷","🌳","🔥","⭐","🍀"][rooms.length%5],price:p,cap:S.nb,eff:fd(new Date().toISOString().slice(0,10))});closeSheet();go("m-rooms");toast(`✓ ${n} created with ${S.nb} bed${S.nb>1?"s":""}`);}
function editName(){openSheet(`<div class="h" style="font-size:18px">✏️ Host / manager name</div><p class="muted small">Shown on receipts, notices and every tenant's phone.</p><div class="field"><label>Display name</label><input id="nmIn" value="${esc(mgr())}"></div><div class="pills">${["Aling Nena","Tita Baby","Manang Rose","Ate Vicky","Kuya Bert"].map(n=>`<button class="pill" onclick="document.getElementById('nmIn').value='${n}'">${n}</button>`).join("")}</div><button class="btn" onclick="saveName()">Save name</button>`);}
function saveName(){const v=document.getElementById("nmIn").value.trim();if(!v){toast("Please type a name");return;}S.mgr=v;closeSheet();render();toast(`✓ Host name is now ${v}`);}
function verifyPay(id){const i=payQ.findIndex(q=>q.id===id);if(i<0)return;const q=payQ.splice(i,1)[0],t=tn(q.tid);t.status="paid";t.dep=30;t.nextDue="Nov "+t.due;receipts.unshift({tid:t.id,amt:q.amt,method:q.method,date:"Oct 20"});toast(`✓ Verified. ${t.first} gets a receipt.`);render();}
function verifyAll(){[...payQ].forEach(q=>verifyPay(q.id));}
function rejectPay(id){const q=payQ.find(x=>x.id===id),t=tn(q.tid);q.note=`Asked ${t.first} for a clearer screenshot.`;toast(`Rejected — ${t.first} will be asked to check the reference number.`);render();}
function remindOverdue(){toast("💸 Reminder sent to "+tenants.filter(t=>t.status==="overdue").map(t=>t.first).join(", "));}
function copyCode(){try{navigator.clipboard.writeText("192.168.1.50:8080#BM-T9821")}catch(e){}toast("📋 Code copied");}
function pickEmo(i){S.d.i=i;S.d.title=EMO[i][1];S.d.msg=EMO[i][2];render();}
function dispatch(){const d=S.d,to=d.t==="all"?"Everyone":d.room;if(d.t==="room"&&!d.room){toast("Pick a room first");return;}alerts.out.unshift({em:EMO[d.i][0],title:d.title||EMO[d.i][1],to,msg:d.msg,time:"Just now",sms:d.sms?1:0});S.at="hist";toast(`✓ Sent to ${to}${d.sms?" + SMS fallback":""}`);render();}
function logSent(em,title,to,msg){alerts.out.unshift({em,title,to,msg,time:"Just now",sms:0});}
function alertSet(id,st){const a=alerts.in.find(x=>x.id===id);a.st=st;a.act=st==="done"?"Marked done by "+mgr():"";toast(st==="done"?"✓ Marked as handled":st==="pending"?"Report reopened":"Dismissed");render();}
function alertReply(id){const a=alerts.in.find(x=>x.id===id);S.at="send";S.d.t=a.room.startsWith("Room")?"room":"all";S.d.room=a.room.startsWith("Room")?a.room:null;S.d.i=0;S.d.title="Action: "+a.title;S.d.msg=`Regarding "${a.title}": ${mgr()} is on it. Salamat po!`;render();}
function mStart(id){const m=maint.find(x=>x.id===id);m.st="prog";toast(`Status → In progress. ${m.by} can see this.`);render();}
function mDone(id){S.md=id;openSheet(`<div class="h" style="font-size:18px">✓ Mark as done</div><div class="field" style="margin-top:12px"><label>Note for the tenant (optional)</label><input id="mnote" placeholder="e.g. Replaced the faucet"></div><button class="btn" onclick="mDoneSave()">Save</button>`);}
function mDoneSave(){const m=maint.find(x=>x.id===S.md),n=document.getElementById("mnote").value.trim();m.st="done";if(n)m.note=n;closeSheet();render();toast(`✓ Marked done. ${m.by} is notified.`);}
function confirmRevoke(n){openSheet(`<div class="h" style="font-size:18px">⛔ Revoke ${n}'s phone?</div><p class="muted">Their app stops working with the house immediately. Use this when a phone is lost or the tenant moves out. You can pair a new phone anytime.</p><button class="btn danger" onclick="closeSheet();toast('⛔ Device revoked')">Revoke</button><button class="btn ghost" onclick="closeSheet()">Cancel</button>`);}
function moveOut(id){const t=tenants.find(x=>x.id===id);openSheet(`<div class="h" style="font-size:18px">📦 Move out ${t.first}</div><div class="field" style="margin-top:12px"><label>Move-out date</label><input value="Oct 25, 2026"></div><div class="receipt"><div class="kv"><span>Last cycle (Oct 15–25, 11 of 31 days)</span><b>${peso(88710)}</b></div><div class="kv"><span>Unpaid before that</span><b>${peso(250000)}</b></div><div class="kv"><span>Deposit held</span><b>− ${peso(250000)}</b></div><div class="kv"><span>Deductions (broken fan)</span><b>${peso(0)}</b></div><div class="kv total"><span>${t.first} still owes</span><span>${peso(88710)}</span></div></div><div class="banner info" style="margin-top:10px">After move-out: device revoked, presence history deleted, ${rooms.find(r=>r.id===t.room).name} share suggested for the roommate.</div><button class="btn" onclick="closeSheet();toast('✓ Move-out scheduled')">Confirm move-out</button>`);}
function savePayment(){const f=document.getElementById("refField");if(f&&!document.getElementById("ref").value.trim()){f.classList.add("invalid");return;}const t=tenants[document.getElementById("ptsel").selectedIndex];t.status="paid";t.dep=30;t.nextDue="Nov "+t.due;for(let i=payQ.length-1;i>=0;i--)if(payQ[i].tid===t.id)payQ.splice(i,1);receipts.unshift({tid:t.id,amt:t.share,method:S.method,date:"Oct 20"});toast(`✓ ${t.first} marked Paid. Receipt ready to share.`);setTimeout(()=>go("m-billing"),700);}
function tenantPay(){const f=document.getElementById("refField");let bad=false;if(f&&!document.getElementById("ref").value.trim()){f.classList.add("invalid");bad=true;}if(S.method!=="Cash"&&!(S.photos.tpay>0)){document.getElementById("pf-tpay").classList.add("invalid");bad=true;}if(bad)return;const rf=document.getElementById("ref");S.photos.tpay=0;if(queued())return setTimeout(()=>go("t-bills"),900);payQ.push({id:uid(),tid:me.id,amt:me.share,method:S.method,ref:rf?rf.value.trim():"Cash",sent:"Oct 20, 7:42 PM"});me.status="pending";toast("✓ Sent! Status: Pending until the manager checks.");setTimeout(()=>{go("t-bills");},800);}
function sendProblem(){const f=document.getElementById("titleField"),ti=document.getElementById("ptitle").value.trim();if(!ti){f.classList.add("invalid");return;}if(queued())return;const c=CATS[S.rc||0];maint.unshift({id:uid(),st:"open",cat:c.split(" ")[0],title:ti,room:"Room "+me.room,by:me.first,time:"Just now",desc:document.getElementById("pdesc").value,ph:Array(S.photos.prob||0).fill(c.split(" ")[0]),urg:S.ru||"Medium"});S.photos.prob=0;toast("✓ Sent to the manager. You'll see updates here.");go("t-report");}
function showReceipt(id){const t=tenants.find(x=>x.id===id);openSheet(`<div class="receipt"><div style="text-align:center"><div style="font-size:34px">🏠</div><div class="h">Santos Boarding House</div><div class="muted small">Official payment receipt #2026-0142</div></div><div class="kv" style="margin-top:10px"><span>Tenant</span><b>${t.name}</b></div><div class="kv"><span>Room</span><b>Room ${t.room} · ${t.bed}</b></div><div class="kv"><span>For</span><b>Rent Sep ${t.due} – Oct ${t.due-1||30}</b></div><div class="kv"><span>Method</span><b>GCash · 1008 7721 0042</b></div><div class="kv"><span>Date</span><b>Sep ${t.due}, 2026</b></div><div class="kv total"><span>Amount paid</span><span>${peso(250000)}</span></div><div style="text-align:center;margin-top:8px" class="chip paid">✓ Verified by ${mgr()}</div></div><button class="btn" onclick="closeSheet();toast('📤 Sharing receipt image…')">📤 Share image</button>`);}
function newAnn(){openSheet(`<div class="h" style="font-size:18px">📣 New announcement</div><div class="field" style="margin-top:12px"><label>Title</label><input placeholder="e.g. Garbage collection schedule"></div><div class="field"><label>Message</label><textarea></textarea></div><div class="row between" style="min-height:48px"><span>📌 Pin to top</span><button class="toggle" onclick="this.classList.toggle('on')"></button></div><button class="btn" onclick="closeSheet();toast('📣 Posted to all 6 tenants')">Post</button>`);}
function composer(em,label,target,msg){openSheet(`<div class="h" style="font-size:18px">${em} ${label}</div><div class="field" style="margin-top:12px"><label>Send to</label><select><option>${target}</option><option>Room A</option><option>Room B</option><option>Room C</option><option>Everyone</option></select></div><div class="field"><label>Message (editable)</label><textarea>${msg}</textarea></div><div class="row between" style="min-height:48px"><span>💬 Also send by SMS<br><span class="muted small">For tenants whose app is closed</span></span><button class="toggle" onclick="this.classList.toggle('on')"></button></div><button class="btn" onclick="closeSheet();logSent('${em}','${label}','${target}',document.querySelector('#sheet textarea').value);toast('✓ Sent to ${target}. Delivered instantly to open apps, others on next sync.')">Send</button>`);}
function noiseSheet(){openSheet(`<div class="h" style="font-size:18px">🔊 Where is the noise from?</div><p class="muted small">It's 7:42 PM — <b>outside quiet hours</b> (10 PM–6 AM). You can still send it.</p><div class="pills" id="roomPick">${["Room A","Room B","Room C","Not sure"].map(r=>`<button class="pill" onclick="pickRoom(this,'${r}')">${r}</button>`).join("")}</div><div id="ownWarn"></div><div class="field" style="margin-top:12px"><label>Short note (optional)</label><input maxlength="100" placeholder="e.g. loud music"></div><div class="banner info">🔒 The other room <b>won't know</b> it was you. The manager will see your name so the button isn't misused.</div><button class="btn" onclick="sendNoise()">Send to manager</button><p class="muted small" style="text-align:center">You can send one noise report every 30 minutes.</p>`);}
function pickRoom(el,r){el.parentNode.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));el.classList.add('on');S.sel.room=r;document.getElementById('ownWarn').innerHTML=r==="Room A"?`<div class="banner warn" style="margin-top:10px">💭 This is your own room. Maria may guess it was you — talking to her first can help 🙂</div>`:"";}
function sendNoise(){if(!S.sel.room){toast("Please pick a room first");return;}closeSheet();if(queued())return;alerts.in.unshift({id:uid(),em:"🔊",title:"Too noisy",room:S.sel.room,from:me.first,time:"Just now",st:"pending",msg:""});toast("✓ Sent. Thank you! The manager will handle it kindly.");setTimeout(()=>notif("Manager's phone: 🔊 Noise report",`${S.sel.room} · from ${me.first}`),1200);S.sel={};}
function simpleAlert(em,label){S.sa=[em,label];openSheet(`<div class="h" style="font-size:18px">${em} ${label}</div><div class="field" style="margin-top:12px"><label>Short note (optional)</label><input id="sn" maxlength="100" placeholder="Add details if helpful"></div><button class="btn" onclick="sendSimple()">Send to manager</button>`);}
function sendSimple(){const [em,label]=S.sa,n=document.getElementById("sn").value;closeSheet();if(queued())return;alerts.in.unshift({id:uid(),em,title:label,room:"Room "+me.room,from:me.first,time:"Just now",st:"pending",msg:n});toast("✓ Sent to the manager");setTimeout(()=>notif(`Manager's phone: ${em} ${label}`,`from ${me.first} · Room ${me.room}`),1200);}
function bindHold(){const b=document.getElementById("holdBtn");if(!b)return;const fill=document.getElementById("holdFill");let start,raf;const step=()=>{const p=Math.min(1,(Date.now()-start)/2000);fill.style.width=(p*100)+"%";if(p<1)raf=requestAnimationFrame(step);else{cancel();if(queued())return;openSheet(`<div class="h" style="font-size:18px">🚨 What's happening?</div><div class="tiles" style="margin-top:12px">${[["🔥","Fire"],["🩺","Medical"],["🦹","Intruder"]].map(x=>`<button class="tile emer" onclick="alerts.in.unshift({id:uid(),em:'🚨',title:'EMERGENCY — ${x[1]}',room:'Room '+me.room,from:me.first,time:'Just now',st:'pending',msg:''});closeSheet();toast('🚨 Manager alerted (loud alarm). Call 911 if you haven\\'t.');setTimeout(()=>notif('Manager\\'s phone: 🚨 EMERGENCY — ${x[1]}','${me.first} · Room ${me.room} · ignores quiet hours'),1000)"><span class="em">${x[0]}</span>${x[1]}</button>`).join("")}</div>`);}};const cancel=()=>{cancelAnimationFrame(raf);fill.style.width="0";};const down=e=>{e.preventDefault();start=Date.now();raf=requestAnimationFrame(step);};b.addEventListener("mousedown",down);b.addEventListener("touchstart",down);["mouseup","mouseleave","touchend"].forEach(ev=>b.addEventListener(ev,cancel));}

/* ---------------- Render ---------------- */
function render(){
 const sc=screens[S.screen];
 // index
 const groups={manager:"👩‍💼 Manager screens",tenant:"🧑 Tenant screens"};
 document.getElementById("index").innerHTML=Object.keys(groups).map(g=>`<h3>${groups[g]}</h3>`+Object.entries(screens).filter(([,s])=>s.role===g).map(([id,s])=>`<a class="${id===S.screen?"on":""}" onclick="switchTo('${id}')">${s.title}</a>`).join("")).join("");
 // content
 const showState = S.state!=="normal" && sc.nav!==false && sc.empty!==undefined;
 document.getElementById("content").innerHTML = showState ? stateView(sc) : sc.render();
 // nav
 const navEl=document.getElementById("nav");
 if(sc.nav===false){navEl.style.display="none";}else{navEl.style.display="flex";navEl.innerHTML=navs[S.role].map(n=>`<button class="${sc.tab===n[0]?"on":""}" onclick="go('${n[3]}')"><span class="ic">${n[1]}</span>${n[2]}${n[4]&&pendCnt()?`<span class="badge">${pendCnt()}</span>`:""}</button>`).join("");}
 // notes
 document.getElementById("notes").innerHTML=`<span class="tag">${sc.role==="manager"?"Manager":"Tenant"}</span><h2>${sc.title}</h2><h4>Purpose</h4><p>${sc.purpose}</p><h4>Flow</h4><ul>${sc.flow.map(f=>`<li>${f}</li>`).join("")}</ul>${sc.empty?`<h4>Empty state text</h4><p class="muted">“${sc.empty}”</p><p class="small muted">Use the <b>Screen state</b> selector above to preview loading / empty / error.</p>`:""}${S.role==="tenant"?`<p class="small muted">Use the WiFi selector above to preview the Away and Host-away modes.</p>`:""}`;
 // role seg
 document.querySelectorAll("#roleSeg button").forEach(b=>b.classList.toggle("on",b.dataset.role===S.role));
 document.getElementById("offlineWrap").style.display=S.role==="tenant"?"":"none";document.getElementById("personaWrap").style.display=S.role==="tenant"?"":"none";if(S.role==="tenant")syncPersona();
 bindHold();
 fixBanners(document.getElementById("content"));
}
function switchTo(id){S.role=screens[id].role;go(id);}
document.querySelectorAll("#roleSeg button").forEach(b=>b.onclick=()=>{S.role=b.dataset.role;go(S.role==="manager"?"m-lock":(S.pairing?"t-scan":"t-consent"));});
document.getElementById("stateSel").onchange=e=>{S.state=e.target.value;render();};
document.getElementById("offlineSel").onchange=e=>{S.net=e.target.value;render();};
document.getElementById("personaSel").onchange=e=>{me=tn(+e.target.value);render();};
render();
</script>
</body>
</html>
